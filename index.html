<style>
:root{--bg:#F2EADA;--ink:#4A3520;--accent:#D06A66;--sub:#8A7A63;--card:#FBF7EF;--line:#E3D8C2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:"Noto Sans JP",system-ui,sans-serif;line-height:1.7;
-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:32px 20px 64px}
header{text-align:center;margin-bottom:28px}
h1{font-family:"Zen Maru Gothic",sans-serif;font-size:22px;margin:0 0 6px;font-weight:700}
.tag{color:var(--accent);font-size:13px;font-weight:500;letter-spacing:.08em;margin:0 0 10px}
.note{color:var(--sub);font-size:13px;margin:0}
.own{background:var(--ink);color:var(--bg);border-radius:16px;padding:22px 20px;margin:0 0 32px;text-align:center}
.own-label{color:#C9B99C;font-size:12px;letter-spacing:.1em;margin:0 0 6px}
.own-title{font-family:"Zen Maru Gothic",sans-serif;font-size:19px;font-weight:700;margin:0 0 8px}
.own-text{font-size:13px;color:#DCD1BC;margin:0 0 16px}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
padding:11px 26px;border-radius:999px;font-size:14px;font-weight:500}
h2{font-family:"Zen Maru Gothic",sans-serif;font-size:16px;margin:0 0 14px;font-weight:700}
.card{display:flex;gap:14px;align-items:flex-start;background:var(--card);
border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;
text-decoration:none;color:inherit}
.cover{width:84px;height:auto;border-radius:4px;border:1px solid var(--line);flex:none}
.cover.noimg{width:84px;height:112px;background:var(--line)}
.info{min-width:0}
.title{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:15px;margin:0 0 4px}
.meta{color:var(--sub);font-size:12px;margin:0 0 6px}
.lead{color:var(--accent);font-size:13px;margin:0}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:40px 0}
footer{margin-top:40px;text-align:center;color:var(--sub);font-size:12px}
footer a{color:var(--sub)}
</style>
</head>
